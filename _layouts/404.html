---
layout: compress
---

<!DOCTYPE html>
<html lang="en">
  {% include bs5/head.html %}
  {% include bs5/navbar.html %}
  

  <style>
    body, html {
      height: 100%;
      margin: 0;
    }

    .bg-spin {
      background-image: url('https://raw.githubusercontent.com/BlazeK1ng420/BlazeK1ng420.github.io/refs/heads/base/assets/images/gifs/ColorlessBruisedGoose-size_restricted.gif'); /* change as needed */
      background-size: cover;
      background-position: center;
      animation: spinBackground 60s linear infinite;
    }

    @keyframes spinBackground {
      0% {
        background-position: center center;
        transform: rotate(0deg);
      }
      100% {
        background-position: center center;
        transform: rotate(360deg);
      }
    }
  </style>

  <body class="bg-dark text-white d-flex align-items-center justify-content-center bg-spin">
    <div class="container text-center py-5">
      <h1 class="display-3 text-uppercase fw-bold text-white">
        {{ page.title }}
      </h1>
      <h3 class="text-uppercase fw-medium text-light mb-4">
        {{ content }}
      </h3>
      <hr class="border-light">
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ site.url }}{{ site.baseurl }}/" class="btn btn-outline-light rounded-pill text-uppercase">
          Home
        </a>
      </div>
    </div>
  </body>
</html>
